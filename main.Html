<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>I'm Sorry, My Love</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(120deg, #ffdde1, #f8bbd0);
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .heart-bg {
      position: absolute;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 0;
    }

    .heart {
      position: absolute;
      color: rgba(255, 105, 180, 0.4);
      font-size: 20px;
      animation: floatHearts 8s infinite ease-in;
    }

    @keyframes floatHearts {
      0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 1; }
    }

    .container {
      z-index: 1;
      position: relative;
      width: 440px;
      height: 330px;
      perspective: 1000px;
    }

    .drop-button {
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      background-color: #d81b60;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1em;
      border-radius: 25px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.2);
      animation: dropIn 1.5s ease-out forwards;
      opacity: 0;
      cursor: pointer;
      z-index: 3;
    }

    @keyframes dropIn {
      0% { transform: translateX(-50%) translateY(-200px); opacity: 0; }
      100% { transform: translateX(-50%) translateY(0); opacity: 1; }
    }

    .envelope {
      width: 100%;
      height: 100%;
      background: #fff;
      border: 3px solid #d81b60;
      border-radius: 15px;
      overflow: hidden;
      position: relative;
      transform-style: preserve-3d;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: transform 1s ease;
    }

    .flap {
      width: 100%;
      height: 50%;
      background: #d81b60;
      position: absolute;
      top: 0;
      transform-origin: top;
      transform: rotateX(0deg);
      transition: transform 1s ease;
      z-index: 2;
      border-bottom: 2px solid #b71c5c;
    }

    .opened .flap {
      transform: rotateX(-180deg);
    }

    .heart-icon {
      font-size: 2em;
      color: #d81b60;
      position: absolute;
      left: 50%;
      top: -40px;
      transform: translateX(-50%);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.1); }
      100% { transform: translateX(-50%) scale(1); }
    }

    .message {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-40%, -40%);
      text-align: center;
      font-size: 1.3em;
      color: #3c003c;
      line-height: 0.7em;
      font-family: 'Dancing Script', cursive;
      white-space: pre-wrap;
      max-width: 90%;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    .envelope.opened .message {
      animation: fadeIn 2s ease forwards 1s;
    }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translate(-50%, -55%); }
      100% { opacity: 1; transform: translate(-50%, -50%); }
    }
  </style>
</head>
<body>

  <!-- Floating Hearts -->
  <div class="heart-bg" id="hearts"></div>

  <div class="container">
    <!-- Button -->
    <button class="drop-button" onclick="openEnvelope()">Hey babe, click me 💌</button>

    <!-- Envelope -->
    <div class="envelope" id="envelope">
      <div class="flap"></div>
      <div class="heart-icon">💌</div>

      <!-- Hidden Message Inside Envelope -->
      <div class="message" id="message">
        <p><strong>My Dearest Love,</strong></p>
        <p>I know I’ve made a mistake...<br>and I’ve hurt the one I cherish most.</p>
        <p>Every second without you feels wrong.</p>
        <p>I’m sorry, truly —<br>Please forgive me. 💖</p>
        <p><em>— Yours forever</em></p>
      </div>
    </div>
  </div>

  <!-- Music -->
  <audio id="bgMusic" src="Jeena Jeena Badlapur 128 Kbps.mp3"></audio>

  <script>
    // Floating Hearts
    const heartContainer = document.getElementById("hearts");
    for (let i = 0; i < 30; i++) {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (Math.random() * 4 + 3) + "s";
      heart.style.fontSize = (Math.random() * 20 + 10) + "px";
      heart.style.top = Math.random() * 100 + "vh";
      heartContainer.appendChild(heart);
    }

    // Open Envelope Function
    function openEnvelope() {
      const envelope = document.getElementById("envelope");
      const music = document.getElementById("bgMusic");
  

      if (!envelope.classList.contains("opened")) {
        envelope.classList.add("opened");
        
        music.play();
      }
    }
  </script>

</body>
</html>
